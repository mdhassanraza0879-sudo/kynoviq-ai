<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Vibrant Metallic Gradient -->
    <linearGradient id="kynoviqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Core Core Sparkle Gradient -->
    <radialGradient id="coreSparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a5b4fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for 3D Depth -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Subtle Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#kynoviqGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Main Geometric Hex-Crystal K Emblem Group -->
  <g filter="url(#shadow3d)" transform="translate(256, 256)">
    <!-- Hexagon Outer Frame -->
    <polygon points="0,-175 151,-87 151,87 0,175 -151,87 -151,-87" fill="url(#kynoviqGrad)" rx="20" />
    
    <!-- Inner Dark Glass Cutout -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#0b0f19" opacity="0.92" />

    <!-- Stylized Futuristic 'K' AI Neural Struts -->
    <!-- Left Vertical Neural Pillar -->
    <path d="M-85,-110 L-50,-110 L-50,110 L-85,110 Z" fill="url(#kynoviqGrad)" />

    <!-- Top Diagonal Strut -->
    <path d="M-40,-15 L45,-105 L95,-105 L0,0 Z" fill="url(#innerGlow)" />

    <!-- Bottom Diagonal Strut -->
    <path d="M0,0 L95,105 L45,105 L-40,15 Z" fill="url(#kynoviqGrad)" />

    <!-- Core AI Neural Node Sparkle -->
    <circle cx="0" cy="0" r="32" fill="url(#coreSparkle)" />
    <path d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z" fill="#ffffff" />
  </g>

  <!-- Corner Glowing Nodes -->
  <circle cx="105" cy="105" r="8" fill="#38bdf8" opacity="0.8" />
  <circle cx="407" cy="407" r="8" fill="#c084fc" opacity="0.8" />
</svg>
